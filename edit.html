<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17211F">
<title>ギャラリーのタグ修正 | La Magica＊Prism Ceremony</title>
<style>
:root{--night:#17211F;--night2:#1f2c29;--moon:#f3f1e8;--soft:#aab4b0;--line:#3a4a45;--acc:#8fd9b0;--bad:#ff7a96}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);color:var(--moon);font:15px/1.6 -apple-system,"Hiragino Sans","Zen Kaku Gothic New",sans-serif}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:#17211Fee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
h1{font-size:15px;margin:0 0 6px;letter-spacing:.06em}
h1 small{color:var(--soft);font-weight:400;margin-left:6px}
.row{display:flex;gap:8px;align-items:center}
select{flex:1;min-width:0;background:var(--night2);color:var(--moon);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;font-size:14px}
label.sw{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft);white-space:nowrap}
main{max-width:1080px;margin:0 auto;padding:12px}
.help{color:var(--soft);font-size:12.5px;margin:2px 2px 10px}
.grid{column-count:2;column-gap:8px}
@media(min-width:560px){.grid{column-count:3}}@media(min-width:900px){.grid{column-count:4}}
.item{position:relative;display:block;width:100%;margin:0 0 8px;break-inside:avoid;border-radius:6px;overflow:hidden;background:var(--night2);box-shadow:0 0 0 1px #aeb8b624;cursor:pointer;border:0;padding:0}
.item img{display:block;width:100%;height:auto;background:var(--night2)}
.item.edited{box-shadow:0 0 0 3px var(--acc)}
.item .pen{position:absolute;top:6px;right:6px;background:var(--acc);color:#0b1511;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px}
.item .tg{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:3px;padding:18px 5px 5px;background:linear-gradient(transparent,#000b)}
.item .tg span{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;background:#0b100fb0;border-radius:999px;padding:1px 7px 1px 5px;box-shadow:0 0 0 1px var(--rb,#fff3)}
.item .tg i{width:8px;height:8px;border-radius:50%;background:var(--c,#888);box-shadow:0 0 0 1px #fff6}
.more{display:block;margin:14px auto;background:var(--night2);color:var(--moon);border:1px solid var(--line);border-radius:999px;padding:10px 22px;font:inherit}
.empty{text-align:center;color:var(--soft);padding:50px 10px}
/* 拡大表示（ギャラリーと同じ操作: 左右スワイプ・矢印キー・Esc） */
.viewer{position:fixed;inset:0;z-index:30;background:#0b100f;display:flex;flex-direction:column}
.viewer[hidden],.dlg[hidden]{display:none}
.v-top{display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 14px 6px;color:var(--soft);font-size:13px}
.v-top button{background:none;border:0;color:var(--moon);font-size:26px;line-height:1;padding:4px 10px}
.v-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:pan-y}
.v-stage img{max-width:100%;max-height:100%;display:block;transition:transform .15s}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);background:#0b100f99;border:1px solid var(--line);color:var(--moon);width:42px;height:56px;font-size:22px;border-radius:10px}
.v-nav.prev{left:8px}.v-nav.next{right:8px}.v-nav:disabled{opacity:.25}
.v-info{max-height:44vh;overflow-y:auto;padding:10px 12px calc(94px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b100f 14px)}
.v-meta{font-size:12.5px;color:var(--soft);margin-bottom:8px}.v-meta a{color:#9cf}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(min-width:560px){.chips{grid-template-columns:repeat(3,1fr)}}
.chip{--c:#8c7bd6;--rb:#aab4b066;--rt:#ffffff0d;--fg:#fff;display:flex;align-items:center;gap:8px;border:1px solid var(--rb);background:var(--rt);color:var(--moon);border-radius:12px;padding:10px 9px;font:inherit;font-size:12.5px;text-align:left;line-height:1.3;cursor:pointer}
.chip i{width:13px;height:13px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 1.5px #fff6}
.chip.on{background:var(--c);color:var(--fg);box-shadow:0 0 14px -3px var(--rb)}
.chip.on i{background:var(--fg);box-shadow:none}
.chip.none{grid-column:1/-1;justify-content:center;border-style:dashed}
/* 送信バー */
.send{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#17211Ff5;border-top:1px solid var(--line)}
.send .cnt{flex:1;font-size:14px}.send .cnt small{display:block;color:var(--soft);font-size:11.5px}
.btn{border:1px solid var(--line);background:var(--night2);color:var(--moon);border-radius:12px;padding:12px 16px;font:inherit;cursor:pointer}
.btn.pri{background:var(--acc);color:#0b1511;border-color:var(--acc);font-weight:700;padding:12px 26px}
.btn:disabled{opacity:.4}
.dlg{position:fixed;inset:0;z-index:60;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px}
.dlg>div{background:var(--night2);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:380px;width:100%}
.dlg h2{font-size:16px;margin:0 0 8px}.dlg p{margin:0 0 10px;color:var(--soft);font-size:13px}
.dlg input{width:100%;background:#0b100f;border:1px solid var(--line);color:var(--moon);border-radius:10px;padding:11px;font:inherit;margin-bottom:12px}
.dlg .row{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#e8efe9;color:#0b1511;padding:10px 18px;border-radius:999px;font-size:13px;z-index:70;box-shadow:0 4px 18px #0008;max-width:92vw;text-align:center}
</style>
</head>
<body>
<header>
  <h1>ギャラリーのタグ修正<small id="ht"></small></h1>
  <div class="row"><select id="fsel" aria-label="絞り込み"></select><label class="sw"><input type="checkbox" id="showTags"> 一覧にタグを出す</label></div>
</header>
<main>
  <p class="help">写真をタップして拡大し、写っているキャラをタップして直します。直したら、画面下の<b>「送信」</b>を押すと、公開ギャラリーに反映されます。<br><a href="tagger/" style="color:#9cf">再学習・検出のやり直しは、管理ページへ →</a></p>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden></button>
  <p class="empty" id="empty" hidden></p>
</main>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="写真の拡大表示とタグの修正">
  <div class="v-top"><span id="v-count"></span><button id="v-close" aria-label="閉じる">×</button></div>
  <div class="v-stage" id="v-stage"><img id="v-img" alt=""><button class="v-nav prev" id="v-prev" aria-label="前の写真">‹</button><button class="v-nav next" id="v-next" aria-label="次の写真">›</button></div>
  <div class="v-info"><div class="v-meta" id="v-meta"></div><div class="chips" id="v-chips"></div></div>
</div>

<div class="send"><div class="cnt"><b id="cnt">修正 0 件</b><small id="cnt2">直した写真がここに溜まります</small></div><button class="btn" id="reset" disabled>取り消す</button><button class="btn pri" id="sendBtn" disabled>送信</button></div>

<div class="dlg" id="dlg" hidden><div><h2>合言葉</h2><p>送信には、合言葉が必要です（この端末のブラウザにだけ保存されます）。</p><input type="password" id="pw" autocomplete="off" placeholder="合言葉"><div class="row"><button class="btn" id="pwCancel">やめる</button><button class="btn pri" id="pwOk">OK</button></div></div></div>

<script>window.MKP_BRIDGE = "https://script.google.com/macros/s/AKfycbyIiMomc-aaZxKwA24g2fN-Tl0mouYsw_lVVibmoajT_5evOqP60rN_jMQyIki6eBwn/exec"; // 受け付け窓口（秘密ではない。合言葉がないと何も受け付けない）</script>
<script src="data/content.js"></script>
<script src="data/x-gallery.js"></script>
<script>
"use strict";
var XG = window.X_GALLERY || {}, SITE = window.SITE || {}, G = SITE.gallery || {};
var SHEET = XG.sheetId, HASHTAG = String(XG.hashtag || ""), CHARS = (G.tags || []).slice(), COLORS = G.colors || {};
var isLocal = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
var BRIDGE = (isLocal && new URLSearchParams(location.search).get("bridge")) || window.MKP_BRIDGE || "";
var PAGE = 40;
var $ = function (s) { return document.querySelector(s); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
var LS = (function () { var ok = true; try { localStorage.setItem("_t", "1"); localStorage.removeItem("_t"); } catch (e) { ok = false; }
  return { get: function (k, d) { try { var v = ok ? localStorage.getItem(k) : null; return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
           set: function (k, v) { try { if (ok) localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } }; })();
function toast(m, ms) { var t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, ms || 2800); }

/* ---- 色（キャラのイメージカラー） ---- */
function rgb(h) { h = String(h || "").replace("#", ""); var n = parseInt(h, 16); return h.length === 6 && !isNaN(n) ? [(n >> 16) & 255, (n >> 8) & 255, n & 255] : null; }
function styleOf(name) {
  var cs = (COLORS[name] || []).filter(rgb); if (!cs.length) return "";
  var r = rgb(cs[0]), avg = cs.map(rgb).reduce(function (a, c) { return a + (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255; }, 0) / cs.length;
  return "--c:" + (cs.length > 1 ? "linear-gradient(135deg," + cs.join(",") + ")" : cs[0]) + ";--rb:rgba(" + r.join(",") + ",.75);--rt:rgba(" + r.join(",") + ",.14);--fg:" + (avg > 0.58 ? "#14201d" : "#fff");
}

/* ---- ギャラリーのシートを読む（公開ギャラリーと同じデータ） ---- */
var S = { photos: [], fsel: "all", shown: PAGE, idx: -1, list: [], pending: LS.get("pending", {}) };
function gviz() {
  var url = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(SHEET) + "/gviz/tq?tqx=out:json&headers=1&sheet=" + encodeURIComponent(XG.sheetName || "mkp_gallery") + "&t=" + Date.now();
  return fetch(url, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("http"); return r.text(); }).then(function (t) {
    var m = t.match(/setResponse\(([\s\S]*)\);?\s*$/); if (!m) throw new Error("parse");
    var d = JSON.parse(m[1].replace(/Date\(([^)]+)\)/g, '"$1"')); var labels = d.table.cols.map(function (c) { return (c.label || "").trim(); });
    return d.table.rows.map(function (row) { var o = {}; (row.c || []).forEach(function (c, i) { o[labels[i]] = c && c.v != null ? c.v : ""; }); return o; });
  });
}
function load() {
  return gviz().then(function (rows) {
    var want = HASHTAG.toLowerCase();
    S.photos = rows.filter(function (p) { return p.drive_file_id && p.tag_status !== "excluded" && String(p.hashtags).toLowerCase().split(",").map(function (x) { return x.trim(); }).indexOf(want) >= 0; })
      .map(function (p) { return { id: String(p.drive_file_id), tags: String(p.characters || "").split(",").map(function (t) { return t.trim(); }).filter(function (t) { return t && t !== "未分類"; }),
        ok: p.tag_status === "confirmed", handle: p.author_handle, url: p.tweet_url, at: String(p.posted_at || ""), w: Number(p.width) || 0, h: Number(p.height) || 0 }; })
      .sort(function (a, b) { return a.at < b.at ? 1 : a.at > b.at ? -1 : 0; });
    S.err = false;
  }).catch(function () { S.err = true; S.photos = []; });
}
function tagsOf(p) { return S.pending[p.id] ? S.pending[p.id] : p.tags; }
function sameTags(a, b) { return a.length === b.length && a.every(function (t) { return b.indexOf(t) >= 0; }); }
function setTags(p, tags) {
  var t = CHARS.filter(function (c) { return tags.indexOf(c) >= 0; });   // 並びはキャラの順にそろえる
  if (sameTags(t, p.tags)) delete S.pending[p.id]; else S.pending[p.id] = t;
  LS.set("pending", S.pending);
}
function nPending() { return Object.keys(S.pending).length; }

/* ---- 一覧 ---- */
function filtered() {
  var f = S.fsel;
  return S.photos.filter(function (p) {
    var t = tagsOf(p);
    return f === "all" ? true : f === "none" ? !t.length : f === "edited" ? !!S.pending[p.id] : f === "unconfirmed" ? !p.ok && !S.pending[p.id] : t.indexOf(f) >= 0;
  });
}
function img(p, w) { return "https://lh3.googleusercontent.com/d/" + encodeURIComponent(p.id) + "=w" + w; }
function paintGrid() {
  var list = filtered(), shown = list.slice(0, S.shown), show = $("#showTags").checked;
  $("#grid").innerHTML = shown.map(function (p, i) {
    var t = tagsOf(p), ed = !!S.pending[p.id];
    var tg = show ? '<div class="tg">' + (t.length ? t.map(function (n) { return '<span style="' + esc(styleOf(n)) + '"><i></i>' + esc(n) + "</span>"; }).join("") : '<span>タグなし</span>') + "</div>" : "";
    var ratio = p.w && p.h ? ' style="aspect-ratio:' + p.w + "/" + p.h + '"' : "";
    return '<button class="item' + (ed ? " edited" : "") + '" data-i="' + i + '"' + '><img loading="lazy" alt=""' + ratio + ' src="' + img(p, 500) + '">' + (ed ? '<span class="pen">修正</span>' : "") + tg + "</button>";
  }).join("");
  var more = $("#more"); more.hidden = list.length <= shown.length; more.textContent = "もっと見る（残り " + (list.length - shown.length) + " 枚）";
  var em = $("#empty"); em.hidden = !!list.length; em.textContent = S.err ? "ギャラリーを読み込めませんでした。通信を確認して、再読み込みしてください。" : "該当する写真はありません。";
  paintSend(); S.list = list;
}
function paintFilter() {
  var opts = [["all", "すべて"], ["none", "タグなし"], ["unconfirmed", "未確認のみ"], ["edited", "直した写真（未送信）"]].concat(CHARS.map(function (c) { return [c, c]; }));
  $("#fsel").innerHTML = opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === S.fsel ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join("");
  $("#ht").textContent = "#" + HASHTAG + " ・ " + S.photos.length + "枚";
}
function paintSend() {
  var n = nPending();
  $("#cnt").textContent = "修正 " + n + " 件"; $("#cnt2").textContent = n ? "「送信」を押すと、ギャラリーに反映されます" : "直した写真がここに溜まります";
  $("#sendBtn").disabled = !n; $("#reset").disabled = !n;
}

/* ---- 拡大表示（ここでタグを直す） ---- */
function openViewer(i) { S.idx = i; $("#viewer").hidden = false; document.body.style.overflow = "hidden"; paintViewer(); }
function closeViewer() { $("#viewer").hidden = true; document.body.style.overflow = ""; S.idx = -1; paintGrid(); }
function curr() { return S.list[S.idx]; }
function paintViewer() {
  var p = curr(); if (!p) return;
  var t = tagsOf(p);
  $("#v-img").src = img(p, 1600);
  $("#v-count").textContent = (S.idx + 1) + " / " + S.list.length + (S.pending[p.id] ? " ・ 修正あり（未送信）" : p.ok ? " ・ 確認済み" : "");
  $("#v-meta").innerHTML = "@" + esc(p.handle) + (p.url ? ' ・ <a target="_blank" rel="noopener" href="' + esc(p.url) + '">元の投稿を開く</a>' : "");
  $("#v-chips").innerHTML = CHARS.map(function (n) { var on = t.indexOf(n) >= 0; return '<button class="chip' + (on ? " on" : "") + '" data-n="' + esc(n) + '" style="' + esc(styleOf(n)) + '"><i></i><span>' + esc(n) + "</span></button>"; }).join("") +
    '<button class="chip none" data-clear="1">写っているキャラはいない（タグなし）</button>';
  $("#v-prev").disabled = S.idx <= 0; $("#v-next").disabled = S.idx >= S.list.length - 1; paintSend();
  [S.idx - 1, S.idx + 1].forEach(function (k) { if (S.list[k]) { var im = new Image(); im.src = img(S.list[k], 1600); } });
}
function go(d) { var n = S.idx + d; if (n >= 0 && n < S.list.length) { S.idx = n; document.querySelector(".v-info").scrollTop = 0; paintViewer(); } }
$("#v-chips").onclick = function (e) {
  var p = curr(); if (!p) return; var t = tagsOf(p).slice(), b;
  if ((b = e.target.closest("[data-clear]"))) t = [];
  else if ((b = e.target.closest("[data-n]"))) { var n = b.dataset.n, i = t.indexOf(n); if (i >= 0) t.splice(i, 1); else t.push(n); }
  else return;
  setTags(p, t); paintViewer();
};
$("#v-prev").onclick = function () { go(-1); }; $("#v-next").onclick = function () { go(1); }; $("#v-close").onclick = closeViewer;
document.addEventListener("keydown", function (e) { if ($("#viewer").hidden) return; if (e.key === "Escape") closeViewer(); else if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1); });
(function () { var sx = null, sy = 0, st = $("#v-stage");
  st.addEventListener("touchstart", function (e) { if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } else sx = null; }, { passive: true });
  st.addEventListener("touchend", function (e) { if (sx == null) return; var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1); }); })();

/* ---- 送信（溜めた修正を、まとめて反映） ---- */
function askPass() {
  return new Promise(function (res) {
    var d = $("#dlg"), inp = $("#pw"); inp.value = ""; d.hidden = false; setTimeout(function () { inp.focus(); }, 50);
    var done = function (v) { d.hidden = true; $("#pwOk").onclick = $("#pwCancel").onclick = null; res(v); };
    $("#pwOk").onclick = function () { done(inp.value.trim()); }; $("#pwCancel").onclick = function () { done(""); };
    inp.onkeydown = function (e) { if (e.key === "Enter") done(inp.value.trim()); };
  });
}
function post(items, pass) {
  return fetch(BRIDGE, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ pass: pass, action: "settags", items: items }) })
    .then(function (r) { if (!r.ok) throw new Error("http_" + r.status); return r.json(); })
    .then(function (j) { if (!j.ok) { var e = new Error(j.error || "error"); e.code = j.error; throw e; } return j; });
}
function send() {
  var ids = Object.keys(S.pending); if (!ids.length) return;
  var go = function (pass) {
    if (!pass) return;
    $("#sendBtn").disabled = true; $("#sendBtn").textContent = "送信中…";
    var items = ids.map(function (id) { return { file_id: id, tags: S.pending[id] }; }), sent = 0;
    (function next(k) {
      if (k >= items.length) return finish();
      post(items.slice(k, k + 30), pass).then(function (j) {
        items.slice(k, k + 30).forEach(function (it) { var p = S.photos.filter(function (x) { return x.id === it.file_id; })[0]; if (p) { p.tags = it.tags.slice(); p.ok = true; } delete S.pending[it.file_id]; });
        LS.set("pending", S.pending); sent += j.saved || 0; next(k + 30);
      }).catch(function (e) {
        $("#sendBtn").textContent = "送信";
        if (e.code === "password") { LS.set("pass", ""); toast("合言葉が違います。もう一度入れてください。"); askPass().then(function (v) { if (v) { LS.set("pass", v); send(); } else paintSend(); }); }
        else { toast("送信できませんでした（" + (e.code || e.message) + "）。通信を確認して、もう一度押してください。", 4500); paintSend(); }
        paintGrid();
      });
    })(0);
    function finish() { $("#sendBtn").textContent = "送信"; paintFilter(); paintGrid(); if (!$("#viewer").hidden) paintViewer(); toast("送信しました（" + sent + " 枚）。ギャラリーに反映されます。", 4200); }
  };
  var saved = LS.get("pass", "");
  if (saved) go(saved); else askPass().then(function (v) { if (v) { LS.set("pass", v); go(v); } });
}
$("#sendBtn").onclick = send;
$("#reset").onclick = function () { if (!nPending() || !confirm("直した内容（未送信の " + nPending() + " 件）をすべて取り消します。よろしいですか？")) return; S.pending = {}; LS.set("pending", S.pending); paintGrid(); };

/* ---- 起動 ---- */
$("#fsel").onchange = function () { S.fsel = this.value; S.shown = PAGE; paintGrid(); window.scrollTo(0, 0); };
$("#showTags").checked = !!LS.get("showTags", false);
$("#showTags").onchange = function () { LS.set("showTags", this.checked); paintGrid(); };
$("#more").onclick = function () { S.shown += PAGE; paintGrid(); };
