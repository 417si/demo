<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 旧サイト：新しいトップページができたため、/old/ に置いています。画像・CSS・データは、ひとつ上の階層のものを使います -->
<base href="../">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Magica＊Prism Ceremony | Magic Kingdom Project 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="武蔵野美術大学公認サークル Magic Kingdom Project（MKP）2026年度 芸術祭公演「La Magica＊Prism Ceremony」公式サイト。10/23〜25 公演。">
<meta name="theme-color" content="#17211F">
<!-- SNSでシェアしたときの表示（公開URLが決まったら og:image / og:url を絶対URLに） -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="La Magica＊Prism Ceremony">
<meta property="og:title" content="La Magica＊Prism Ceremony | Magic Kingdom Project 2026">
<meta property="og:description" content="武蔵野美術大学公認サークル MKP 2026年度 芸術祭公演 公式サイト">
<meta property="og:image" content="assets/img/ogp.jpg">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@mkp_mau">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/img/icon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Shippori+Mincho+B1:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="site" data-page="home">

  <a class="skip" href="old/index.html#story">本文へ移動</a>

  <!-- ===== ヘッダー ===== -->
  <header class="gh" data-header>
    <a class="gh__mark" href="old/index.html#top" aria-label="トップへ戻る">
      <img class="gh__crest" src="assets/img/emblem-silver.png" alt="" width="26" height="32">
      <span class="gh__title" data-site-title>La Magica＊Prism Ceremony</span>
    </a>
    <nav class="gh__nav" aria-label="メインメニュー">
      <a href="old/about.html">About</a>
      <a href="old/gallery.html">Gallery</a>
    </nav>
    <div class="gh__sns" data-sns="icons"></div>
    <button class="gh__menu" type="button" aria-expanded="false" aria-controls="drawer" data-menu>
      <span></span><span></span><span class="sr">メニュー</span>
    </button>
  </header>

  <div class="drawer" id="drawer" hidden data-drawer>
    <nav aria-label="メニュー">
      <a href="old/about.html"><span>About</span><small>MKPについて</small></a>
      <a href="old/gallery.html"><span>Gallery</span><small>写真ギャラリー</small></a>
    </nav>
    <div class="drawer__sns" data-sns="icons"></div>
  </div>

  <main id="top">

    <!-- ===== メインビジュアル（夜の庭とプリズムの光） ===== -->
    <section class="hero hero--full" aria-label="メインビジュアル" data-hero>
      <div class="hero__bg" aria-hidden="true"><img data-poster-bg src="" alt=""></div>
      <div class="hero__glow" aria-hidden="true"></div>
      <a class="hero__scroll" href="old/index.html#story" aria-label="ストーリーへ">Scroll<i></i></a>
      <canvas class="fx" data-fx="night" aria-hidden="true"></canvas>
      <div class="hero__inner">
        <div class="hero__info">
          <p class="hero__tagline" data-tagline></p>
          <ul class="hero__dates" data-hero-dates></ul>
          <button class="hero__whole" type="button" data-zoom>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4V4Zm10 0h6v6h-2V6h-4V4ZM4 14h2v4h4v2H4v-6Zm14 0h2v6h-6v-2h4v-4Z"/></svg>ポスター全体を見る
          </button>
          <button class="hero__replay" type="button" data-replay hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>テーマ映像をもう一度見る
          </button>
        </div>
      </div>
      <div class="hero__bloom" aria-hidden="true"></div>
    </section>

    <!-- ===== ストーリー（光の中へ） ===== -->
    <section class="story" id="story" aria-labelledby="story-h">
      <canvas class="fx fx--sticky" data-fx="light" aria-hidden="true"></canvas>
      <div class="story__aura" aria-hidden="true"></div>

      <div class="story__inner">
        <header class="sec-head">
          <img class="sec-head__spark" src="assets/svg/sparkle.svg" alt="" width="40" height="40">
          <h2 class="sec-head__en" id="story-h">Story</h2>
          <p class="sec-head__ja">ものがたり</p>
        </header>
        <div class="story__text" data-story></div>
      </div>
      <div class="story__band" aria-hidden="true"></div>
    </section>

    <!-- ===== キャラクター ===== -->
    <section class="chars" id="characters" aria-labelledby="chars-h">
      <div class="wrap">
        <header class="sec-head sec-head--dark">
          <img class="sec-head__spark" src="assets/svg/sparkle.svg" alt="" width="40" height="40">
          <h2 class="sec-head__en" id="chars-h">Characters</h2>
          <p class="sec-head__ja">ガーデンのなかまたち</p>
        </header>
        <div class="carousel" data-carousel></div>
      </div>
    </section>

    <!-- ===== 公演情報 ===== -->
    <section class="info parchment" id="information" aria-labelledby="info-h">
      <div class="wrap">
        <header class="sec-head">
          <img class="sec-head__spark" src="assets/svg/sparkle.svg" alt="" width="40" height="40">
          <h2 class="sec-head__en" id="info-h">Information</h2>
          <p class="sec-head__ja">公演情報</p>
          <img class="sec-head__rule" src="assets/svg/rule.svg" alt="" width="360" height="36">
        </header>
        <div class="info__grid">
          <article class="plate" data-schedule></article>
          <article class="notes" data-notes></article>
        </div>
        <div class="news" data-news></div>
      </div>
    </section>

    <!-- ===== グッズ ===== -->
    <section class="goods parchment" id="goods" aria-labelledby="goods-h">
      <div class="wrap">
        <header class="sec-head">
          <img class="sec-head__spark" src="assets/svg/sparkle.svg" alt="" width="40" height="40">
          <h2 class="sec-head__en" id="goods-h">Goods</h2>
          <p class="sec-head__ja">グッズ</p>
          <img class="sec-head__rule" src="assets/svg/rule.svg" alt="" width="360" height="36">
        </header>
        <div data-goods></div>
      </div>
    </section>

    <!-- ===== 展示（content.js で enabled: true のときだけ表示） ===== -->
    <section class="exhibit parchment" id="exhibition" aria-labelledby="ex-h" hidden data-exhibition-section>
      <div class="wrap">
        <header class="sec-head">
          <h2 class="sec-head__en" id="ex-h">Exhibition</h2>
          <p class="sec-head__ja">展示</p>
          <img class="sec-head__rule" src="assets/svg/rule.svg" alt="" width="360" height="36">
        </header>
        <div data-exhibition></div>
      </div>
    </section>

    <!-- ===== SNS ===== -->
    <section class="follow parchment" id="follow" aria-labelledby="follow-h">
      <div class="wrap">
        <h2 class="follow__h" id="follow-h">最新情報は SNS で</h2>
        <p class="follow__lead">キャラクター紹介や公演のお知らせを順次公開しています。</p>
        <div class="follow__list" data-sns="cards"></div>
        <a class="follow__about" href="old/about.html">MKPについて・各班の紹介</a>
      </div>
    </section>
  </main>

  <footer class="gf" data-footer></footer>

  <dialog class="lightbox" data-lightbox aria-label="画像の拡大表示">
    <button class="lightbox__close" type="button" data-lightbox-close aria-label="閉じる">×</button>
    <img src="" alt="">
  </dialog>

  <noscript><p class="noscript">このサイトの表示には JavaScript を有効にしてください。</p></noscript>
</div>

<script src="data/content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
