<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | La Magica＊Prism Ceremony</title>
<meta name="robots" content="noindex, nofollow">
<!-- 以前のギャラリーのURL。新しいトップページ（本をひらくとギャラリー）へ転送します。古いギャラリーは old/gallery.html にあります -->
<meta http-equiv="refresh" content="0; url=./#gallery">
<script>
  (function () {
    var h = location.hash.replace(/^#/, ""); // 以前の #tag=キャラ名&all / #page=2 は、そのまま引き継ぐ
    location.replace("./#gallery" + (h ? "&" + h : ""));
  })();
</script>
</head>
<body><p><a href="./#gallery">ギャラリーへ</a></p></body>
</html>
