<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery | La Magica＊Prism Ceremony</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Magic Kingdom Project 2026 芸術祭公演「La Magica＊Prism Ceremony」の公演写真ギャラリー。部員が撮影した写真をキャラクターごとに見られます。">
<meta name="theme-color" content="#17211F">
<meta property="og:type" content="website">
<meta property="og:title" content="Gallery | La Magica＊Prism Ceremony">
<meta property="og:description" content="MKP 2026 芸術祭公演の写真ギャラリー">
<meta property="og:image" content="assets/img/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/img/icon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Shippori+Mincho+B1:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/gallery.css">
</head>
<body>
<div class="site" data-page="gallery">

  <a class="skip" href="#gallery-main">本文へ移動</a>

  <header class="gh" data-header>
    <a class="gh__mark" href="index.html" aria-label="トップページへ">
      <img class="gh__crest" src="assets/svg/emblem-silver.svg" alt="" width="26" height="32">
      <span class="gh__title" data-site-title>La Magica＊Prism Ceremony</span>
    </a>
    <nav class="gh__nav" aria-label="メインメニュー">
      <a href="about.html">About</a>
      <a href="index.html">Home</a>
    </nav>
    <div class="gh__sns" data-sns="icons"></div>
    <button class="gh__menu" type="button" aria-expanded="false" aria-controls="drawer" data-menu>
      <span></span><span></span><span class="sr">メニュー</span>
    </button>
  </header>

  <div class="drawer" id="drawer" hidden data-drawer>
    <nav aria-label="メニュー">
      <a href="about.html"><span>About</span><small>MKPについて</small></a>
      <a href="index.html"><span>Home</span><small>トップ</small></a>
    </nav>
    <div class="drawer__sns" data-sns="icons"></div>
  </div>

  <main id="gallery-main">
    <section class="page-hero page-hero--gallery">
      <canvas class="fx" data-fx="night" aria-hidden="true"></canvas>
      <img class="page-hero__crest" src="assets/svg/emblem-silver.svg" alt="" width="90" height="111">
      <h1>Gallery</h1>
      <p>公演写真ギャラリー</p>
    </section>

    <section class="gal" aria-label="写真の一覧">
      <div class="gal__filter" data-filter-bar>
        <div class="gal__chips" role="group" aria-label="キャラクターで絞り込む" data-filter></div>
      </div>
      <div class="wrap gal__wrap">
        <p class="gal__status" data-status role="status" aria-live="polite"></p>
        <div class="gal__grid" data-grid></div>
        <div class="gal__more" data-more aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <footer class="gf" data-footer></footer>

  <!-- ネタバレ注意（最初に1回だけ出る） -->
  <div class="spoiler" data-spoiler role="dialog" aria-modal="true" aria-labelledby="spoiler-h" hidden>
    <div class="spoiler__card">
      <img class="spoiler__crest" src="assets/svg/emblem-prism.svg" alt="" width="72" height="88">
      <p class="spoiler__en" id="spoiler-h">Notice</p>
      <p class="spoiler__msg" data-spoiler-msg></p>
      <div class="spoiler__btns">
        <button class="spoiler__ok" type="button" data-spoiler-ok>ギャラリーを見る</button>
        <a class="spoiler__back" href="index.html">トップページへ戻る</a>
      </div>
    </div>
  </div>

  <!-- 写真の拡大表示 -->
  <div class="viewer" data-viewer role="dialog" aria-modal="true" aria-label="写真の拡大表示" hidden>
    <div class="viewer__top">
      <span class="viewer__count" data-v-count></span>
      <button class="viewer__close" type="button" data-v-close aria-label="閉じる">×</button>
    </div>
    <div class="viewer__stage" data-v-stage>
      <img class="viewer__img" data-v-img alt="">
      <div class="viewer__spin" aria-hidden="true"></div>
    </div>
    <button class="viewer__nav viewer__nav--prev" type="button" data-v-prev aria-label="前の写真"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="viewer__nav viewer__nav--next" type="button" data-v-next aria-label="次の写真"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="viewer__info" data-v-info></div>
  </div>

  <noscript><p class="noscript">このページの表示には JavaScript を有効にしてください。</p></noscript>
</div>

<script src="data/content.js"></script>
<script src="js/main.js"></script>
<script src="js/gallery-core.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
