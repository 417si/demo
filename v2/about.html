<meta name="theme-color" content="#dcc9a0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Klee+One:wght@400;600&family=Shippori+Mincho+B1:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">

<link rel="stylesheet" href="about.css">

<body class="about">
<div class="desk-bg" aria-hidden="true"></div>

<header class="top top--bar">
  <a class="top__mark" href="./" aria-label="トップ（本の表紙）へ">
    <img class="top__crest" src="../assets/img/emblem-silver.png" alt="" width="24" height="30">
    <span class="top__title foil">La Magica＊Prism Ceremony</span>
  </a>
  <nav class="top__nav" aria-label="サイト内メニュー">
    <a class="top__link" href="./">本にもどる</a>
    <div class="sns" data-sns></div>
  </nav>
</header>

<main id="main" class="wrap">
  <article class="leaf-page">
    <i class="frame"></i><i class="fc fc--tl"></i><i class="fc fc--tr"></i><i class="fc fc--bl"></i><i class="fc fc--br"></i>

    <section class="hero">
      <img class="hero__crest" src="../assets/img/emblem-silver.png" alt="" width="90" height="111">
      <h1 class="hero__h foil foil--shine">We are MKP</h1>
      <p class="hero__sub">Magic Kingdom Project とは</p>
      <img class="foil-rule" src="foil-rule.svg" alt="" width="320" height="24">
      <div class="lead" data-lead></div>
    </section>

    <section aria-labelledby="teams-h">
      <header class="sec"><h2 class="sec__en foil" id="teams-h">Teams</h2><p class="sec__ja">各班の紹介</p><img class="foil-rule" src="foil-rule.svg" alt="" width="320" height="24"></header>
      <div class="teams" data-teams></div>
    </section>

    <section aria-labelledby="works-h">
      <header class="sec"><h2 class="sec__en foil" id="works-h">Works</h2><p class="sec__ja">これまでの公演</p><img class="foil-rule" src="foil-rule.svg" alt="" width="320" height="24"></header>
      <ol class="works" data-works></ol>
    </section>

    <section class="follow" aria-labelledby="follow-h">
      <header class="sec"><h2 class="sec__en foil" id="follow-h">Follow</h2><p class="sec__ja">最新情報は SNS で</p><img class="foil-rule" src="foil-rule.svg" alt="" width="320" height="24"></header>
      <p class="follow__lead">活動の様子や公演のお知らせを発信しています。</p>
      <div class="follow__list" data-sns="cards"></div>
      <div class="follow__back"><a class="plate-btn" href="./"><span class="plate-btn__en">Open the book</span><span class="plate-btn__ja">公演写真ギャラリーへ</span></a></div>
    </section>

    <p class="copy" data-copy></p>
  </article>
</main>

<script src="../data/content.js"></script>
<script src="common.js"></script>
<script src="about.js"></script>
