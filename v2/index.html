<!doctype html>
<html lang="ja" class="is-landing">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Magica＊Prism Ceremony | Magic Kingdom Project 2026</title>
<meta name="description" content="Magic Kingdom Project 2026 芸術祭公演「La Magica＊Prism Ceremony」。本の表紙をひらくと、公演写真のギャラリーが出てきます。">
<meta name="theme-color" content="#b9b19e">
<!-- 公開前の確認用：検索結果に出ないようにしています。正式に公開するときは、この1行を消してください -->
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="La Magica＊Prism Ceremony | MKP 2026">
<meta property="og:description" content="本をひらくと、公演写真のギャラリーが出てきます。">
<meta property="og:image" content="../assets/img/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="../assets/img/icon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<link rel="preload" as="image" href="../assets/img/poster-1200.webp">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Klee+One:wght@400;600&family=Shippori+Mincho+B1:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="landing.css">
<link rel="stylesheet" href="gallery.css">
</head>
<body>
<div class="desk-bg" aria-hidden="true"></div>

<!-- ============ 最初の画面：本の表紙 ============ -->
<div class="landing" data-landing>
  <header class="top">
    <a class="top__mark" href="./" aria-label="トップ（本の表紙）へ">
      <img class="top__crest" src="../assets/img/emblem-silver.png" alt="" width="24" height="30">
      <span class="top__title foil">La Magica＊Prism Ceremony</span>
    </a>
    <div class="sns" data-sns></div>
  </header>

  <main class="desk" id="main">
    <div class="book is-closed" data-book></div>
  </main>

  <p class="hint" data-hint><b class="foil">Tap to open</b><small data-hint-sub>表紙をタップして、本をひらく</small></p>

  <nav class="dock" aria-label="コンテンツ">
    <button class="plate-btn" type="button" data-open="story"><span class="plate-btn__en">Story</span><span class="plate-btn__ja">物語</span></button>
    <a class="plate-btn" href="about.html"><span class="plate-btn__en">About MKP</span><span class="plate-btn__ja">MKPについて</span></a>
  </nav>
</div>

<!-- ============ 本をひらいたあと：ふつうのギャラリーサイト ============ -->
<div class="site" data-site>
  <header class="gh" data-gh>
    <a class="gh__mark" href="#gallery" data-top aria-label="ギャラリーの先頭へ">
      <img class="gh__crest" src="../assets/img/emblem-silver.png" alt="" width="24" height="30">
      <span class="gh__title foil">La Magica＊Prism Ceremony</span>
    </a>
    <button class="gh__menu" type="button" data-menu aria-expanded="false" aria-controls="drawer" aria-label="メニューをひらく"><span></span><span></span><span></span></button>
  </header>

  <main class="gmain" id="gallery-main">
    <section class="ghero">
      <h1 class="ghero__h foil">Gallery</h1>
      <p class="ghero__ja">公演写真ギャラリー</p>
      <hr class="rule">
    </section>

    <section class="gal" aria-label="写真の一覧">
      <div class="gal__filter" data-filter-bar hidden>
        <div class="gal__bar">
          <button type="button" class="gal__toggle" data-filter-toggle aria-expanded="false" aria-controls="gal-panel">
            <span>キャラで絞り込む</span><small data-filter-count></small><i class="gal__chev" aria-hidden="true"></i>
          </button>
          <div class="gal__active" data-active aria-live="polite"></div>
        </div>
        <div class="gal__panel" id="gal-panel" data-panel-filter hidden>
          <div class="gal__chips" role="group" aria-label="キャラクターで絞り込む" data-filter></div>
        </div>
      </div>
      <div class="gal__wrap">
        <div class="gal__mode" data-mode-box role="group" aria-label="絞り込みの条件" hidden>
          <button type="button" data-mode="any">いずれかが写っている</button><button type="button" data-mode="all">全員が写っている</button>
        </div>
        <p class="gal__status" data-status role="status" aria-live="polite"></p>
        <div class="gal__grid" data-grid></div>
        <nav class="gal__pager" data-pager aria-label="ページ" hidden></nav>
      </div>
    </section>
  </main>

  <footer class="gf">
    <img class="gf__crest" src="../assets/img/emblem-silver.png" alt="" width="40" height="49">
    <p class="gf__title foil">La Magica＊Prism Ceremony</p>
    <p class="gf__sub">Magic Kingdom Project 2026</p>
    <div class="sns" data-sns></div>
    <p class="gf__note" data-credit></p>
    <p class="gf__copy" data-copy></p>
  </footer>
</div>

<!-- ハンバーガーメニュー -->
<div class="drawer" id="drawer" data-drawer hidden>
  <div class="drawer__scrim" data-drawer-close></div>
  <nav class="drawer__sheet" aria-label="メニュー">
    <button class="drawer__close" type="button" data-drawer-close aria-label="メニューを閉じる">×</button>
    <p class="drawer__title foil">Menu</p>
    <hr class="rule">
    <ul class="drawer__list">
      <li><button type="button" data-open="story"><b>Story</b><small>物語</small></button></li>
      <li><a href="about.html"><b>About MKP</b><small>MKPについて</small></a></li>
    </ul>
    <hr class="rule">
    <div class="sns" data-sns></div>
    <a class="drawer__back" href="./" data-back>‹ 本の表紙にもどる</a>
  </nav>
</div>

<!-- パネル（巻物）：中身は panels.js が data/content.js から作ります -->
<div class="panel" data-panel="story" role="dialog" aria-modal="true" aria-labelledby="p-story" hidden>
  <div class="sheet">
    <button class="sheet__close" type="button" data-close aria-label="閉じる">×</button>
    <div class="sheet__scroll">
      <header class="sheet__head"><h2 class="sheet__en foil" id="p-story">Story</h2><p class="sheet__ja">物語</p><hr class="rule"></header>
      <div class="story" data-story></div>
    </div>
  </div>
</div>
<!-- 写真の拡大表示 -->
<div class="lb" data-lb role="dialog" aria-modal="true" aria-label="写真の拡大表示" hidden>
  <div class="lb__top">
    <span class="lb__count" data-lb-count></span>
    <button class="lb__close" type="button" data-lb-close aria-label="閉じる">×</button>
  </div>
  <div class="lb__stage" data-lb-stage>
    <figure class="lb__print" data-lb-print><img data-lb-img alt=""></figure>
    <div class="lb__spin" aria-hidden="true"></div>
  </div>
  <button class="lb__nav lb__nav--prev" type="button" data-lb-prev aria-label="前の写真"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="lb__nav lb__nav--next" type="button" data-lb-next aria-label="次の写真"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="lb__info" data-lb-info></div>
</div>

<noscript><p style="position:fixed;inset:auto 0 20px;text-align:center">このサイトの表示には JavaScript を有効にしてください。</p></noscript>

<script src="../data/content.js"></script>
<script src="../data/x-gallery.js"></script>
<script src="../js/gallery-core.js"></script>
<script src="common.js"></script>
<script src="panels.js"></script>
<script src="gallery.js"></script>
<script src="landing.js"></script>
</body>
</html>
