<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101312">
<title>タグ付け・再学習 | MKP26</title>
<style>
:root{--bg:#101312;--card:#1b211f;--line:#334039;--fg:#eef1ef;--sub:#9aa6a0;--acc:#7fd4a8;--warn:#ffb454;--bad:#ff6b8a;--sug:#3b6fe0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,"Hiragino Sans",sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#101312ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px}
h1{font-size:15px;margin:0;flex:1;line-height:1.3}
.badge{font-size:12px;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.badge.on{color:#0b1511;background:var(--acc);border-color:var(--acc)}.badge.off{color:#2a0b14;background:var(--bad);border-color:var(--bad)}
main{max-width:640px;margin:0 auto;padding:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:#101312f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:12px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button b{font-size:18px;font-weight:400;line-height:1}
nav.tabs button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sub{color:var(--sub);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:12px 14px;font:inherit;width:100%;text-align:left;cursor:pointer}
.btn:disabled{opacity:.45}
.btn.pri{background:var(--acc);color:#0b1511;border-color:var(--acc);font-weight:700}
.btn b{display:block;font-size:15px}.btn span{display:block;font-size:12px;opacity:.75;margin-top:2px;font-weight:400}
.stack>*{margin-bottom:10px}
.crop{width:min(100%,calc(58vh * var(--r)));aspect-ratio:var(--r);margin:0 auto;background:#000 no-repeat;border-radius:12px}
.ctx{display:flex;gap:10px;align-items:center;margin:10px 0 12px;font-size:12px;color:var(--sub)}
.ctx .mini{position:relative;width:96px;flex:none;background:#000 center/cover;border-radius:8px;overflow:hidden}
.ctx .mini i{position:absolute;border:2px solid #ff3b6b}
.ctx a{color:#9cf}
.pred{margin:0 0 8px;font-size:14px}.pred b{color:var(--warn)}
.sugs{display:grid;gap:8px;margin-bottom:10px}
.chip{--c:var(--sug);--rb:var(--line);--rt:#ffffff0d;--fg:#fff;display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--rb);background:var(--rt);color:var(--fg2,var(--fg));border-radius:12px;padding:12px;font:inherit;text-align:left;cursor:pointer;line-height:1.3}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 1.5px #ffffff55}
.chip small{margin-left:auto;color:var(--sub);font-size:11px;white-space:nowrap}
.chip.sug{border-width:2px}
.chip.other{border-style:dashed}
details.all{margin-top:6px}details.all summary{cursor:pointer;color:var(--sub);padding:8px 2px;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid .chip{padding:9px 9px;font-size:12.5px}
.row{display:flex;gap:8px;margin:10px 0}.row .btn{text-align:center;padding:10px}
.done{padding:40px 8px;text-align:center;color:var(--sub)}
.job{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-size:13px}
.job:first-child{border-top:0}.job .st{white-space:nowrap}.st.done{color:var(--acc)}.st.running{color:var(--warn)}.st.queued{color:var(--sub)}.st.error{color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}.kv dt{color:var(--sub)}.kv dd{margin:0;text-align:right}
.notice{background:#3a2a10;border:1px solid #6b4a14;color:#ffd699;border-radius:12px;padding:12px;font-size:13px;margin-bottom:12px}
input[type=text],input[type=password]{width:100%;background:#0b0e0d;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:11px;font:inherit}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#e8efe9;color:#0b1511;padding:9px 16px;border-radius:999px;font-size:13px;z-index:30;box-shadow:0 4px 18px #0008;max-width:90vw}
</style>
</head>
<body>
<header>
  <h1>タグ付け・再学習<br><span class="sub" id="ht"></span></h1>
  <span class="badge" id="worker">確認中…</span>
</header>
<main id="main"><p class="done">読み込み中…</p></main>
<nav class="tabs" id="tabs">
  <button data-t="review" class="on"><b>🏷</b>確認</button>
  <button data-t="act"><b>⚙</b>操作</button>
  <button data-t="status"><b>📊</b>状態</button>
  <button data-t="set"><b>🔑</b>設定</button>
</nav>

<script src="../data/content.js"></script>
<script src="../data/x-gallery.js"></script>
<script>
"use strict";
var XG = window.X_GALLERY || {}, SITE = window.SITE || {}, GCFG = SITE.gallery || {};
var SHEET = XG.sheetId, HASHTAG = XG.hashtag || "";
var CHARS = (GCFG.tags || []).slice(), COLORS = GCFG.colors || {};
var OTHER = "対象外", FAIRY = "妖精たち", MIN_H = 150;
var LS = (function () { var ok = true; try { localStorage.setItem("_t", "1"); localStorage.removeItem("_t"); } catch (e) { ok = false; }
  return { get: function (k, d) { try { var v = ok ? localStorage.getItem(k) : null; return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
           set: function (k, v) { try { if (ok) localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } }; })();
// 開発用: localhost で開いたときだけ ?bridge=... で窓口の URL を差し替えられる（本番では無効）
var isLocal = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
var qBridge = isLocal ? new URLSearchParams(location.search).get("bridge") : null;
var S = { tab: "review", crops: [], status: {}, jobs: [], skipped: {}, hist: [], busy: false };
var $ = function (s) { return document.querySelector(s); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function bridge() { return qBridge || LS.get("bridge", "") || (window.MKP_BRIDGE || ""); }
function pass() { return LS.get("pass", ""); }
function toast(m) { var t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }

/* ---------- 色（サイトと同じ。キャラのイメージカラー） ---------- */
function hex2rgb(h) { h = String(h || "").replace("#", ""); var n = parseInt(h, 16); return h.length === 6 && !isNaN(n) ? [(n >> 16) & 255, (n >> 8) & 255, n & 255] : null; }
function chipStyle(name) {
  var cs = (COLORS[name] || []).filter(hex2rgb); if (!cs.length) return "";
  var bg = cs.length > 1 ? "linear-gradient(135deg," + cs.join(",") + ")" : cs[0], r = hex2rgb(cs[0]);
  return "--c:" + bg + ";--rb:rgba(" + r.join(",") + ",.75);--rt:rgba(" + r.join(",") + ",.14)";
}

/* ---------- スプレッドシート（読み取り。公開されている gviz を使う） ---------- */
function gviz(tab, headers) {
  var url = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(SHEET) + "/gviz/tq?tqx=out:json&headers=" + (headers ? 1 : 0) + "&sheet=" + encodeURIComponent(tab) + "&t=" + Date.now();
  return fetch(url, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("http_" + r.status); return r.text(); }).then(function (t) {
    var m = t.match(/setResponse\(([\s\S]*)\);?\s*$/); if (!m) throw new Error("parse");
    var d = JSON.parse(m[1]); if (d.status === "error") throw new Error("sheet");
    var labels = d.table.cols.map(function (c) { return (c.label || "").trim(); });
    return d.table.rows.map(function (row) { var o = []; (row.c || []).forEach(function (c, i) { o[i] = c && c.v != null ? c.v : ""; }); o._l = labels; return o; });
  });
}
function rowObj(row) { var o = {}; row._l.forEach(function (l, i) { o[l] = row[i] == null ? "" : row[i]; }); return o; }
function loadAll() {
  return Promise.all([
    gviz("crops", true).then(function (rs) { S.crops = rs.map(rowObj).sort(function (a, b) { return a.prio - b.prio; }); }).catch(function () { S.crops = []; S.cropsErr = true; }),
    gviz("status", false).then(function (rs) { var o = {}; rs.forEach(function (r) { if (r[0]) o[r[0]] = r[1]; }); S.status = o; }).catch(function () { S.status = {}; }),
    gviz("jobs", true).then(function (rs) { S.jobs = rs.map(rowObj).reverse().slice(0, 8); }).catch(function () { S.jobs = []; })
  ]).then(function () { paintWorker(); });
}

/* ---------- Macのワーカーの生存確認 ---------- */
function paintWorker() {
  var hb = S.status.heartbeat, el = $("#worker"), age = null;
  if (hb) { var t = Date.parse(String(hb).replace(" ", "T") + "+09:00"); if (!isNaN(t)) age = (Date.now() - t) / 1000; }
  if (age != null && age < 240) { el.className = "badge on"; el.textContent = "Mac稼働中"; }
  else { el.className = "badge off"; el.textContent = "Macが応答なし"; }
  $("#ht").textContent = "#" + (S.status.hashtag || HASHTAG);
}
function workerOn() { return $("#worker").classList.contains("on"); }

/* ---------- ラベル（端末に保存 → 受け付け窓口へ送信） ---------- */
function myLabels() { return LS.get("labels", {}); }
function postBridge(body) {
  var url = bridge(); if (!url) return Promise.reject(new Error("no_bridge"));
  body.pass = pass();
  return fetch(url, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
    .then(function (r) { if (!r.ok) throw new Error("http_" + r.status); return r.json(); })
    .then(function (j) { if (!j.ok) { var e = new Error(j.error || "error"); e.code = j.error; throw e; } return j; });
}
var flushing = false;
function flush() {
  if (flushing || !bridge() || !pass()) return Promise.resolve();
  var L = myLabels(), ids = Object.keys(L).filter(function (k) { return !L[k].sent; });
  if (!ids.length) return Promise.resolve();
  flushing = true;
  var batch = ids.slice(0, 50).map(function (id) { return { id: id, label: L[id].label, pred: L[id].pred || "", score: L[id].score || "", ts: L[id].ts }; });
  return postBridge({ action: "labels", items: batch, device: LS.get("device", "") }).then(function () {
    var L2 = myLabels(); batch.forEach(function (b) { if (L2[b.id] && L2[b.id].ts === b.ts) L2[b.id].sent = true; }); LS.set("labels", L2);
    flushing = false; updatePending(); return flush();
  }).catch(function (e) { flushing = false; if (e.code === "password") toast("合言葉が違います（設定を確認）"); updatePending(); });
}
function pending() { var L = myLabels(); return Object.keys(L).filter(function (k) { return !L[k].sent; }).length; }
function updatePending() { var el = $("#pend"); if (el) el.textContent = pending() ? "未送信 " + pending() + "件" : "送信済み"; }
function setLabel(c, label) {
  var L = myLabels(); L[c.id] = { label: label, pred: c.pred || "", score: c.score || "", ts: Math.floor(Date.now() / 1000), sent: false };
  LS.set("labels", L); S.hist.push(c.id); flush(); paint();
}
function undo() {
  var id = S.hist.pop(); if (!id) return;
  var L = myLabels(); L[id] = { label: "", pred: "", score: "", ts: Math.floor(Date.now() / 1000), sent: false }; LS.set("labels", L);
  delete S.skipped[id]; S.front = id; flush(); paint();
}

/* ---------- 画面: 確認 ---------- */
function queue() {
  var L = myLabels();
  var q = S.crops.filter(function (c) { var m = L[c.id]; var has = m ? !!m.label : !!c.label; return !has && !S.skipped[c.id] && c.h * c.ih >= MIN_H; });
  if (S.front) { var i = q.findIndex(function (c) { return c.id === S.front; }); if (i > 0) q.unshift(q.splice(i, 1)[0]); }
  return q;
}
function chipBtn(name, score, rank, cls) {
  var st = chipStyle(name);
  return '<button class="chip ' + (rank ? "sug " : "") + (cls || "") + '" data-l="' + esc(name) + '"' + (st ? ' style="' + esc(st) + '"' : "") + "><i></i><span>" + esc(name) + "</span>" +
    (rank ? "<small>候補" + rank + " " + Number(score).toFixed(2) + "</small>" : "") + "</button>";
}
function viewReview() {
  var q = queue(), c = q[0], nLab = Object.keys(myLabels()).filter(function (k) { return myLabels()[k].label; }).length;
  if (S.cropsErr || !S.crops.length) {
    return '<div class="notice">確認用の一覧がまだありません。Macで <b>mkp worker</b> を起動すると、ここに切り出しが並びます。</div><button class="btn" id="reload"><b>もう一度読み込む</b></button>';
  }
  if (!c) return '<div class="done"><p>確認するものはもうありません 🎉</p><p>「操作」タブで<b>再学習</b>を押すと、付けたラベルが反映されます。</p><p class="sub">ラベル済み ' + nLab + ' 件 ・ <span id="pend"></span></p></div>';
  var r = (c.w * c.iw) / (c.h * c.ih);
  var bx = c.w > 0.999 ? 0 : (c.x / (1 - c.w)) * 100, by = c.h > 0.999 ? 0 : (c.y / (1 - c.h)) * 100;
  var img = "https://lh3.googleusercontent.com/d/" + encodeURIComponent(c.fid) + "=w1400";
  var tops = [[c.t1, c.s1], [c.t2, c.s2], [c.t3, c.s3]].filter(function (t) { return t[0]; });
  var names = CHARS.filter(function (n) { return !tops.some(function (t) { return t[0] === n; }); });
  return '<div class="crop" style="--r:' + r.toFixed(4) + ";background-image:url('" + img + "');background-size:" + (100 / c.w).toFixed(2) + "% auto;background-position:" + bx.toFixed(2) + "% " + by.toFixed(2) + '%"></div>' +
    '<div class="ctx"><div class="mini" style="aspect-ratio:' + c.iw + "/" + c.ih + ";background-image:url('" + img + "')\"><i style=\"left:" + (c.x * 100).toFixed(1) + "%;top:" + (c.y * 100).toFixed(1) + "%;width:" + (c.w * 100).toFixed(1) + "%;height:" + (c.h * 100).toFixed(1) + '%"></i></div>' +
    "<div>@" + esc(c.handle) + "<br>" + (c.url ? '<a target="_blank" rel="noopener" href="' + esc(c.url) + '">元の投稿を開く</a><br>' : "") + "残り " + q.length + ' 件 ・ <span id="pend"></span></div></div>' +
    '<p class="pred">今の予想: <b>' + esc(c.pred || "タグなし") + "</b>" + (c.score ? "（類似度 " + Number(c.score).toFixed(2) + "）" : "") + "</p>" +
    '<div class="sugs">' + tops.map(function (t, i) { return chipBtn(t[0], t[1], i + 1); }).join("") + "</div>" +
    '<div class="row"><button class="btn" id="skip">スキップ</button><button class="btn" id="undo"' + (S.hist.length ? "" : " disabled") + ">1つ戻る</button></div>" +
    '<details class="all"><summary>ほかのキャラから選ぶ（' + names.length + '人）</summary><div class="grid">' + names.map(function (n) { return chipBtn(n); }).join("") + "</div></details>" +
    '<div class="grid" style="margin-top:8px">' + (tops.some(function (t) { return t[0] === FAIRY; }) ? "" : chipBtn(FAIRY, 0, 0, "other")) + (tops.some(function (t) { return t[0] === OTHER; }) ? "" : chipBtn(OTHER, 0, 0, "other")) + "</div>";
}

/* ---------- 画面: 操作（取得・検出のやり直し・再学習） ---------- */
var JOBS = [
  { type: "scrape", title: "新しい投稿を取得してタグ付け", sub: "Xの #" + HASHTAG + " から新しい写真を集めて、タグを付けます（数分〜10分）", ask: "新しい投稿を取得して、タグ付けまで行います。よろしいですか？" },
  { type: "redetect", title: "人物の検出をやり直す", sub: "保存済みの写真の人物の枠を取り直して、タグを付け直します", ask: "人物の検出をやり直して、タグ付けをやり直します。よろしいですか？" },
  { type: "learn", title: "ラベルを学習する（再学習）", sub: "スマホで付けたラベルを参考画像に足して、全体のタグを付け直します", ask: "付けたラベルを学習して、全体のタグを付け直します。よろしいですか？" },
  { type: "refresh", title: "一覧を更新する", sub: "確認画面の一覧とステータスだけを最新にします（すぐ終わります）", ask: "" }
];
function viewAct() {
  var warn = "";
  if (!bridge()) warn = '<div class="notice">指示の受け付け窓口（Apps Script）がまだ設定されていません。「設定」タブで URL と合言葉を入れると、ここから実行できます。</div>';
  else if (!pass()) warn = '<div class="notice">合言葉が未設定です。「設定」タブで入れてください。</div>';
  else if (!workerOn()) warn = '<div class="notice">Macのワーカーが応答していません。Macで <b>mkp worker</b> を起動してください。指示は受け付けて、ワーカーが起動したら実行されます。</div>';
  return warn + '<div class="stack">' + JOBS.map(function (j) { return '<button class="btn' + (j.type === "learn" ? " pri" : "") + '" data-job="' + j.type + '"><b>' + esc(j.title) + "</b><span>" + esc(j.sub) + "</span></button>"; }).join("") + "</div>" +
    '<div class="card" style="margin-top:14px"><div class="sub" style="margin-bottom:6px">最近の指示（<span id="pend"></span>）</div><div id="jobs">' + jobsHtml() + "</div></div>";
}
function jobsHtml() {
  if (!S.jobs.length) return '<div class="sub">まだ指示はありません</div>';
  var name = { scrape: "取得", redetect: "検出やり直し", learn: "再学習", refresh: "一覧更新" }, st = { queued: "待機中", running: "実行中", done: "完了", error: "エラー" };
  return S.jobs.map(function (j) {
    return '<div class="job"><div><b>' + esc(name[j.type] || j.type) + '</b> <span class="sub">' + esc(String(j.requested_at).slice(5, 16)) + "</span>" + (j.message ? '<div class="sub">' + esc(j.message) + "</div>" : "") + '</div><div class="st ' + esc(j.state) + '">' + esc(st[j.state] || j.state) + "</div></div>";
  }).join("");
}
function sendJob(type) {
  var job = JOBS.filter(function (j) { return j.type === type; })[0];
  if (job.ask && !confirm(job.ask)) return;
  if (!bridge() || !pass()) { toast("先に「設定」で窓口のURLと合言葉を入れてください"); S.tab = "set"; return paint(); }
  var pre = type === "learn" ? flush() : Promise.resolve();
  S.busy = true;
  pre.then(function () {
    if (type === "learn" && pending()) throw new Error("ラベルを送信できませんでした。通信を確認してもう一度。");
    return postBridge({ action: "job", type: type });
  }).then(function () { toast("指示を送りました"); return loadAll(); }).catch(function (e) {
    toast(e.code === "password" ? "合言葉が違います" : e.code === "duplicate" ? "同じ指示がすでに待機中です" : e.message === "no_bridge" ? "窓口が未設定です" : "送信できませんでした: " + (e.message || ""));
  }).then(function () { S.busy = false; paint(); });
}

/* ---------- 画面: 状態 / 設定 ---------- */
function viewStatus() {
  var s = S.status, tg = Number(s.photos) ? Math.round((Number(s.tagged) * 100) / Number(s.photos)) : 0;
  return '<div class="card"><dl class="kv"><dt>対象</dt><dd>#' + esc(s.hashtag || HASHTAG) + "</dd><dt>写真</dt><dd>" + esc(s.photos || "-") + " 枚</dd><dt>タグが付いた写真</dt><dd>" + esc(s.tagged || "-") + " 枚（" + tg + "%）</dd>" +
    "<dt>人物の切り出し</dt><dd>" + esc(s.crops || "-") + " 件</dd><dt>ラベル済み</dt><dd>" + esc(s.labeled || "-") + " 件</dd><dt>未確認（大きいもの）</dt><dd>" + esc(s.unlabeled || "-") + " 件</dd></dl></div>" +
    '<div class="card"><div class="sub">Macからのメッセージ</div><div>' + esc(s.message || "-") + '</div><div class="sub" style="margin-top:6px">最終更新 ' + esc(s.updated || "-") + "</div></div>" +
    '<button class="btn" id="reload"><b>最新の状態を読み込む</b></button>';
}
function viewSet() {
  return '<div class="card"><label class="f">指示の受け付け窓口（Apps Script ウェブアプリのURL）</label><input type="text" id="s_url" value="' + esc(LS.get("bridge", "")) + '" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off">' +
    '<label class="f">合言葉</label><input type="password" id="s_pass" value="' + esc(pass()) + '" autocomplete="off">' +
    '<label class="f">この端末の名前（任意。ラベルの記録に残ります）</label><input type="text" id="s_dev" value="' + esc(LS.get("device", "")) + '" placeholder="例: iPhone">' +
    '<div class="row"><button class="btn pri" id="s_save"><b>保存</b></button><button class="btn" id="s_test"><b>接続テスト</b></button></div></div>' +
    '<p class="sub">この端末のブラウザの中にだけ保存されます（公開サイトには含まれません）。</p>';
}

/* ---------- 描画とイベント ---------- */
function paint() {
  document.querySelectorAll("#tabs button").forEach(function (b) { b.classList.toggle("on", b.dataset.t === S.tab); });
  var v = S.tab === "review" ? viewReview() : S.tab === "act" ? viewAct() : S.tab === "status" ? viewStatus() : viewSet();
  $("#main").innerHTML = v; updatePending();
  var q = queue(), c = q[0];
  document.querySelectorAll("#main [data-l]").forEach(function (b) { b.onclick = function () { if (c) setLabel(c, b.dataset.l); }; });
  document.querySelectorAll("#main [data-job]").forEach(function (b) { b.onclick = function () { if (!S.busy) sendJob(b.dataset.job); }; });
  var el;
  if ((el = $("#skip"))) el.onclick = function () { if (c) { S.skipped[c.id] = 1; S.front = null; paint(); } };
  if ((el = $("#undo"))) el.onclick = undo;
  if ((el = $("#reload"))) el.onclick = function () { loadAll().then(paint); };
  if ((el = $("#s_save"))) el.onclick = function () { LS.set("bridge", $("#s_url").value.trim()); LS.set("pass", $("#s_pass").value); LS.set("device", $("#s_dev").value.trim()); toast("保存しました"); flush(); };
  if ((el = $("#s_test"))) el.onclick = function () { LS.set("bridge", $("#s_url").value.trim()); LS.set("pass", $("#s_pass").value); postBridge({ action: "ping" }).then(function () { toast("接続できました ✔"); }).catch(function (e) { toast(e.code === "password" ? "合言葉が違います" : "接続できません: " + (e.message || "")); }); };
}
$("#tabs").onclick = function (e) { var b = e.target.closest("[data-t]"); if (!b) return; S.tab = b.dataset.t; S.front = S.front; paint(); if (S.tab !== "review") loadAll().then(function () { if (S.tab !== "review") paint(); }); };
setInterval(function () { if (S.tab === "act" || S.tab === "status") loadAll().then(function () { if (S.tab === "act") { var j = $("#jobs"); if (j) j.innerHTML = jobsHtml(); } else if (S.tab === "status") paint(); }); else paintWorker(); }, 8000);
if (!SHEET) { $("#main").innerHTML = '<div class="notice">設定（data/x-gallery.js）が読み込めませんでした。</div>'; }
else loadAll().then(function () { S.tab = "review"; paint(); flush(); });
</script>
</body>
